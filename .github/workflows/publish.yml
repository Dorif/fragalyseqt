name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("src/fragalyseqt/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'^__version__ = "([^"]+)"$', text, re.MULTILINE).group(1)
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must be v{version}")
          print(f"Publishing FragalyseQt {version}")
          PY
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python scripts/prepare_pypi_readme.py
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fragalyseqt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
