name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (for example v0.5.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("src/fragalyseqt/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'^__version__ = "([^"]+)"$', text, re.MULTILINE).group(1)
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Tag must be v{version}")
          PY
      - name: Verify generated PyPI description
        run: python scripts/prepare_pypi_readme.py --check
      - name: Build distributions
        run: python -m pip install --upgrade build && python -m build
      - name: Validate distributions
        run: python -m pip install --upgrade twine && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fragalyseqt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
