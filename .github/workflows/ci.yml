name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check (syntax errors + undefined names are hard failures)
        run: ruff check --select=E9,F821,F823 src tests
      - name: Ruff check (full, informational — does not fail the build yet)
        run: ruff check src tests || true

  test:
    name: Tests (py${{ matrix.python-version }}, ${{ matrix.qt-binding }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
        qt-binding: [pyqt6]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libdbus-1-3
      - name: Install package + test extras
        run: pip install ".[${{ matrix.qt-binding }},test]"
      - name: Run test suite (unit + headless GUI smoke tests)
        run: python -m pytest -v

  package:
    name: Build and validate PyPI distributions
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publishing tools
        run: pip install build twine
      - name: Verify generated PyPI description
        run: python scripts/prepare_pypi_readme.py --check
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate metadata and README rendering
        run: python -m twine check --strict dist/*
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          retention-days: 14
